<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elle's Portfolio</title>
  <style>
    body {
      background-color: #FFF8DC;
    }
    .tv-screen video {
      border-radius: 12px;
      overflow: hidden;
    }
     
    .mobile-br::after {
    content: '\A';
    white-space: pre;
    } 
  
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- TV Box + Box -->
    <div class="relative w-[90vw] h-[84vw] sm:w-[450px] sm:h-[420px] tv-container flex items-center justify-center" id="tv-container" style="opacity: 0;">
      <!-- TV Box image -->
      <img src="assets/tv-box.png" alt="TV Box" class="absolute inset-0 w-full h-full z-10 pointer-events-none">

      <!-- Screen inside the TV -->
      <div id="tv-box"
        class="absolute bg-black overflow-hidden rounded-[12px] flex items-center justify-center cursor-pointer z-0
        w-[60%] h-[45%] top-[31%] left-[13%] translate-x-[3%]
        sm:w-[300px] sm:h-[190px] sm:top-[130px] sm:left-[60px] sm:translate-x-2">

        <!-- Static video -->
        <video id="tv-static" class="block w-full h-full object-cover hidden rounded-[12px]" autoplay muted playsinline></video>

        <!-- Content Wrapper -->
        <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center w-full h-full">
          <span id="tv-instruction" class="text-green-400 text-sm text-center">Click Here</span>
          <!-- TV Content (menu) -->
          <div id="tv-content" class="hidden text-green-400 text-xs font-mono">
            <h2 class="mb-2">Welcome to Elle's<span class="mobile-br"></span> Portfolio</h2>
            <a href="landing.html" class="block hover:underline">🏠 Home</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tvBox = document.getElementById('tv-box');
      const tvContent = document.getElementById('tv-content');
      const tvInstruction = document.getElementById('tv-instruction');
      const tvStatic = document.getElementById('tv-static');

      // Preload video in background
      tvStatic.src = 'assets/glitch.mp4';
      tvStatic.load();

      tvBox.addEventListener('click', () => {
        tvStatic.classList.remove('hidden');
        tvStatic.currentTime = 0;
        tvStatic.play();
        tvInstruction.classList.add('hidden');

        setTimeout(() => {
          tvStatic.classList.add('hidden');
          tvContent.classList.remove('hidden');
        }, 1500);
      });

      // Show TV only after image loads
      const tvContainer = document.getElementById('tv-container');
      const tvImage = document.querySelector('.tv-container img');

      tvImage.addEventListener('load', () => {
        tvContainer.style.transition = 'opacity 0.4s ease';
        tvContainer.style.opacity = '1';
      });
    </script>
</body>
</html>
